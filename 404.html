<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#F0E6D2"/>
<title>404 — Caleb Pius</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#F0E6D2;--text:#2A241C;--dim:#726b5c;--accent:#3F5233;--border:rgba(42,36,28,0.09);--mono:'JetBrains Mono',monospace;--display:'Fraunces',serif;--sans:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.box{max-width:480px;border:1px solid var(--border);padding:32px;background:#FBF7EF;border-radius:14px}
h1{font-family:var(--display);font-size:28px;margin:0 0 12px;letter-spacing:-0.01em}
p{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 20px}
a{display:inline-block;border:1px solid var(--border);padding:10px 16px;font-size:12px;letter-spacing:0.04em;color:var(--text);text-decoration:none;border-radius:999px;font-weight:500}
a:hover{border-color:var(--accent);color:var(--accent)}
.meta{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:0.08em;margin-top:16px}
</style>
</head>
<body>
<div class="box">
<h1>404 — Not found</h1>
<p>This page doesn't exist. The site is a single-page portfolio — everything lives on the home page.</p>
<a href="/">Back to home</a>
<div class="meta">v1.0 · CALEB PIUS</div>
</div>
</body>
</html>
